[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-reliability"
version = "0.1.0"
description = "Agent reliability runtime, tools, traces, and offline evals"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Karim Ladak", email = "ladakakarim@gmail.com" }]
dependencies = [
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_reliability*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
