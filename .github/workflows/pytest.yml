name: pytest

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: make test
      - name: Offline eval
        run: python -m agent_reliability.eval.runner --offline --report reports/ci-offline.json
      - name: Compare to pinned baseline
        run: python -m agent_reliability.eval.runner --compare reports/baseline-offline.json reports/ci-offline.json
